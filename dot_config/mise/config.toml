"npm:@openai/codex" = "latest"
"npm:context-mode" = "latest"
"npm:cross-env" = "latest"
"npm:picgo" = "latest"
"npm:skills" = "latest"
"npm:@colbymchenry/codegraph" = "latest"
"npm:openwiki" = "latest"
"npm:@gitee/gitee-cli" = "latest"
"npm:apifox-cli" = { version = "latest", trust_policy_excludes = ["mongoose@7.8.13"] }
"npm:agent-desktop" = "latest"
"pipx:serena-agent" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
pnpm = "latest"
prettier = "latest"
uv = "latest"

[tools.node]
version = "lts"
postinstall = '''
npm install -g \
    docx \
    pptxgenjs \
    react \
    react-dom \
    react-icons \
    sharp 

npx @larksuite/cli@latest install
'''

[tools.python]
version = "3.14"
postinstall = '''
python3 -m pip install \
    --upgrade \
    openpyxl \
    pandas \
    "markitdown[pptx]" \
    Pillow \
    defusedxml \
    lxml \
    pypdf \
    pdfplumber \
    reportlab \
    pypdfium2 \
    pdf2image \
    pytesseract \
    mammoth
'''
